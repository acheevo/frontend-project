name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, build, stories, and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:stories
      - run: npm run build:storybook
      - run: npm audit --audit-level=high

  docker-build:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: frontend-template:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check health, SPA routing, and asset delivery
        env:
          IMAGE: frontend-template:${{ github.sha }}
        run: |
          container_id=$(docker run --detach --read-only --tmpfs /tmp --publish 127.0.0.1::8080 "$IMAGE")
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          base_url="http://$(docker port "$container_id" 8080/tcp)"
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --silent --show-error "$base_url/health"
          curl --fail --silent --show-error "$base_url/example-route" --output /tmp/frontend-index.html
          grep -F '<div id="root"></div>' /tmp/frontend-index.html
          asset=$(sed -n 's/.*src="\(\/assets\/[^"]*\.js\)".*/\1/p' /tmp/frontend-index.html)
          test -n "$asset"
          curl --fail --silent --show-error --head "$base_url$asset" | grep -i 'cache-control:.*immutable'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base_url/assets/missing.js")" = 404
